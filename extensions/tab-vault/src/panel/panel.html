<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TabVault</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <header>
    <h1>TabVault</h1>
    <div id="premium-status" class="status-badge">Checking...</div>
  </header>
  
  <main>
    <section>
      <h2>Current Tabs</h2>
      <div style="display: flex; align-items: center; margin-bottom: 8px;">
        <input type="checkbox" id="select-all-cb" checked>
        <label for="select-all-cb" style="margin-left: 8px; font-size: 13px; cursor: pointer;">Select All / Deselect All</label>
      </div>
      <button id="save-all-btn" style="width: 100%; margin-bottom: 12px; font-weight: 600;">Save Selected Tabs</button>
      <ul id="current-tabs-list"></ul>
    </section>

    <section class="premium-feature">
      <h2>RAM Optimizer <span class="badge-pro">PRO</span></h2>
      <p>Premium features for $1 Lifetime</p>
      <div class="overlay" id="premium-overlay">
        <button id="upgrade-btn">Upgrade Now</button>
      </div>
      <label>
        <input type="checkbox" id="auto-sync-cb" disabled> Enable RAM Optimization
      </label>
    </section>

    <section>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>Saved Vaults</h2>
        <div>
          <input type="file" id="import-file" style="display:none;" accept=".json">
          <button id="import-btn" style="padding: 4px 8px; cursor: pointer; font-size: 12px; margin-right: 4px;">Import JSON</button>
          <button id="export-btn" style="padding: 4px 8px; cursor: pointer; font-size: 12px;">Export JSON</button>
        </div>
      </div>
      <ul id="saved-vaults-list"></ul>
    </section>
  </main>

  <script type="module" src="panel.js"></script>
</body>
</html>
