version: '3.8'

services:
  # Landing Page Server
  landing-page:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./landing:/usr/share/nginx/html
    networks:
      - extension-network
    restart: unless-stopped

  # Backend API Server
  backend-api:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=postgres-db
      - DB_USER=postgres
      - DB_PASSWORD=extensions_secret_password
      - DB_NAME=extensions_db
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - extension-network
    volumes:
      - ./backend:/app
      - /app/node_modules
    restart: unless-stopped

  # PostgreSQL Database
  postgres-db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=extensions_secret_password
      - POSTGRES_DB=extensions_db
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - extension-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d extensions_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:

networks:
  extension-network:
    driver: bridge
